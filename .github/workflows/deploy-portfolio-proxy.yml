name: Deploy portfolio-proxy

on:
  push:
    branches:
      - main
    paths:
      - "tools/portfolio-proxy/**"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No build step: the worker is a single TypeScript module that wrangler
      # bundles itself. It declares no routes either — those are created per
      # claimed portfolio by `is-pinoy registry sync`.
      - name: Deploy
        working-directory: tools/portfolio-proxy
        run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_WORKER_DEPLOY_TOKEN }}

      # The renderer honours the Worker's subdomain header only on a match
      # against this value, so it is the difference between every portfolio
      # rendering and every portfolio 404ing. Kept here rather than in a manual
      # `wrangler secret put` so rotating it is a GitHub secret edit plus a
      # re-run of this workflow.
      #
      # Runs after the deploy: `secret put` needs the script to already exist,
      # which matters on a first deploy into a fresh account. Secrets outlive
      # deploys, so re-running with the value unchanged is a no-op.
      #
      # `printf` rather than `echo` on purpose — a trailing newline would make
      # the constant-time comparison in apps/portfolio/proxy.ts fail on a value
      # that looks correct in both dashboards.
      - name: Sync PORTFOLIO_PROXY_SECRET
        if: ${{ secrets.PORTFOLIO_PROXY_SECRET != '' }}
        working-directory: tools/portfolio-proxy
        run: |
          printf '%s' "$PORTFOLIO_PROXY_SECRET" \
            | pnpm exec wrangler secret put PORTFOLIO_PROXY_SECRET -c worker/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_WORKER_DEPLOY_TOKEN }}
          PORTFOLIO_PROXY_SECRET: ${{ secrets.PORTFOLIO_PROXY_SECRET }}
