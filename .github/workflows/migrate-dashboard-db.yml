name: Migrate dashboard-db

on:
  push:
    branches:
      - main
    paths:
      - "apps/dashboard/drizzle/**"
      - "apps/dashboard/lib/db/schema.ts"
  workflow_dispatch:

jobs:
  migrate:
    name: Apply D1 migrations
    runs-on: ubuntu-latest
    # CLOUDFLARE_D1_API_TOKEN lives in this GitHub Environment, not as a
    # plain repo secret — without this key the job can't see it and
    # db:migrate fails with an empty token.
    environment: "Production – is-pinoy-dev-dashboard"
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # drizzle-kit reads schema.ts directly (drizzle-orm/sqlite-core has no
      # workspace-package dependency), so this needs no prebuild step — unlike
      # deploy-og.yml/deploy-site-audit.yml, which build @is-pinoy-dev/schemas
      # first because their own build imports it.
      #
      # dashboard-db previously had no automated migration step at all: the
      # three prior migrations were applied by hand, per apps/dashboard/README.md's
      # manual setup instructions. This closes that gap going forward — every
      # push to main that changes the schema or adds a migration file now
      # applies it automatically, the same way deploy-status.yml applies
      # status-db's migrations before deploying that Worker. The dashboard
      # itself deploys separately via Vercel, not from this repo's Actions, so
      # there is no "before deploy" step to hang this on — it just runs
      # whenever the schema changes, independent of when Vercel next builds.
      - name: Apply migrations
        working-directory: apps/dashboard
        run: pnpm db:migrate
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
