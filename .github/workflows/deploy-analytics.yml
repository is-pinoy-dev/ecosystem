name: Deploy analytics

on:
  push:
    branches:
      - main
    paths:
      - "tools/analytics/**"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy
        working-directory: tools/analytics
        run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_WORKER_DEPLOY_TOKEN }}

      # The cron reads zone traffic from Cloudflare's GraphQL Analytics API, so
      # without these two the scheduled run throws on every invocation and the
      # database stays empty. They are the Worker's *runtime* credentials and
      # are unrelated to CF_WORKER_DEPLOY_TOKEN above, which only authenticates
      # `wrangler deploy`.
      #
      # CF_API_TOKEN needs exactly one permission: `Zone` → `Analytics` →
      # `Read`, with the is-pinoy.dev zone listed under Zone Resources. The
      # query is zone-scoped, so Account Analytics is not required. Getting the
      # resource list wrong fails at query time rather than at deploy, with
      # "does not have permission com.cloudflare.api.account.zone.analytics.read
      # for zone <id>" — the zone in that message is what the token must cover.
      #
      # GITHUB_TOKEN reads the registry. The read goes through GitHub's GraphQL
      # API, which rejects unauthenticated callers outright, so without it the
      # run aborts before collecting anything. Repository contents read access
      # is enough; it never writes.
      #
      # Kept here rather than in a manual `wrangler secret put` so rotating
      # either one is a GitHub secret edit plus a re-run of this workflow, the
      # same arrangement deploy-portfolio-proxy.yml uses.
      #
      # Runs after the deploy: `secret put` needs the script to already exist,
      # which matters on a first deploy into a fresh account. Secrets outlive
      # deploys, so re-running with the values unchanged is a no-op.
      #
      # `printf` rather than `echo` — a trailing newline would travel into the
      # Authorization header and produce a 400 from an otherwise valid token.
      #
      # The "is it set?" guard lives in the script rather than a step-level
      # `if:`. `secrets` is not an available context there, and referencing it
      # is rejected when the workflow file is parsed — which fails the whole
      # run before any job starts, rather than just skipping the step.
      - name: Sync runtime secrets
        working-directory: tools/analytics
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ZONE_ID" ]; then
            echo "CF_API_TOKEN and/or CF_ZONE_ID are not set — skipping."
            echo "The worker is deployed but its scheduled run will throw and"
            echo "no visit data will be collected until both are configured."
            exit 0
          fi
          printf '%s' "$CF_API_TOKEN" \
            | pnpm exec wrangler secret put CF_API_TOKEN -c worker/wrangler.toml
          printf '%s' "$CF_ZONE_ID" \
            | pnpm exec wrangler secret put CF_ZONE_ID -c worker/wrangler.toml
          if [ -n "$REGISTRY_READ_TOKEN" ]; then
            printf '%s' "$REGISTRY_READ_TOKEN" \
              | pnpm exec wrangler secret put GITHUB_TOKEN -c worker/wrangler.toml
          else
            echo "CF_ECOSYSTEM_REGISTRY_READ_TOKEN is not set — the worker will"
            echo "read the registry unauthenticated and is likely to be rate"
            echo "limited (403) on every run."
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_WORKER_DEPLOY_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_ECOSYSTEM_ANALYTICS_READ_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          REGISTRY_READ_TOKEN: ${{ secrets.CF_ECOSYSTEM_REGISTRY_READ_TOKEN }}
