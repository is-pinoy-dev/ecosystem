name = "tools-site-audit"
main = "index.ts"
compatibility_date = "2026-05-27"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "../build/client"
binding = "ASSETS"

# The dashboard's registry database — read-only against `subdomains`, for the
# `featuresOverride` a dashboard save writes directly (see
# apps/dashboard/lib/db/settings.ts and apps/dashboard/lib/db/schema.ts).
# Read-write against `site_audits`, which this Worker owns: it writes the
# latest scan snapshot there (worker/subdomains-db.ts) so the dashboard can
# read it back. Same database as the dashboard's own CLOUDFLARE_D1_DATABASE_ID
# env var — keep this in step if that database is ever recreated or migrated.
[[d1_databases]]
binding = "SUBDOMAINS_DB"
database_name = "dashboard-db"
database_id = "58109557-f2e5-4dd3-8722-5fbea0e20dfc"

# How the audit reaches a hosted portfolio. A Worker's fetch to its own zone
# does not re-run that zone's Workers routes, so scanning `<label>.is-pinoy.dev`
# would bypass tools-portfolio-proxy, reach the origin under a hostname its
# certificate does not cover, and fail the handshake — HTTP 525 for a page that
# serves fine to a browser. These let /audit-proxy address the renderer directly
# and carry the label itself, exactly as the proxy Worker does.
#
# Only for a *hosted* portfolio. Most subdomains CNAME to their owner's own
# host, and rewriting one of those onto the renderer asks an unrelated origin
# for a portfolio nobody claimed — a 404 charged to a site that serves 200. So
# src/lib/upstream.ts resolves the target's `portfolio` block first and rewrites
# only when there is one; see src/lib/domains.ts.
#
# Must stay in step with tools/portfolio-proxy/worker/wrangler.toml.
[vars]
ROOT_DOMAIN = "is-pinoy.dev"
RENDERER_HOST = "portfolio.is-pinoy.dev"

# PORTFOLIO_PROXY_SECRET is a secret, not a var — the same value held by
# tools-portfolio-proxy and the renderer's Vercel environment. Provisioned by
# .github/workflows/deploy-site-audit.yml from the repository secret of the same
# name, so rotating it is a GitHub secret edit plus a re-run of that workflow.
# Setting it by hand works too, and is how a fresh account gets started:
#   wrangler secret put PORTFOLIO_PROXY_SECRET -c worker/wrangler.toml
# Unset, /audit-proxy falls back to fetching the target's public address, which
# is correct for the apex, for external sites and for a subdomain pointing at
# its owner's own host, but 525s on a hosted portfolio. The
# vars above ship with every deploy; this does not, so it is the one that goes
# missing — and it goes missing quietly, as a 525 attributed to the portfolio.

# PAGESPEED_API_KEY is a secret, not a var — optional, but without it
# /psi-proxy calls Google's PageSpeed Insights API on its low, unauthenticated
# per-IP quota, which a handful of concurrent audits can exhaust. Get a key
# from https://developers.google.com/speed/docs/insights/v5/get-started and:
#   wrangler secret put PAGESPEED_API_KEY -c worker/wrangler.toml
# Unset, the Performance tab still works — it just rate-limits sooner and
# surfaces Google's 429 as the error message.

[[routes]]
pattern = "is-pinoy.dev/_tools/site-audit*"
zone_name = "is-pinoy.dev"

[[routes]]
pattern = "*.is-pinoy.dev/_tools/site-audit*"
zone_name = "is-pinoy.dev"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1
