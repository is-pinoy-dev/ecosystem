name = "tools-contact-form"
main = "index.ts"
compatibility_date = "2026-05-27"
account_id = "fc863d4a3faa0342c0f96ae1723e265a"
workers_dev = false
preview_urls = false

[vars]
# Public Turnstile site key — safe to ship in the client-visible /config
# response, unlike TURNSTILE_SECRET_KEY below. Left empty here on purpose:
# the real value is supplied at deploy time via `wrangler deploy --var
# TURNSTILE_SITE_KEY:...` from the TURNSTILE_SITE_KEY repository *variable*
# (Settings > Secrets and variables > Actions > Variables tab — not
# Secrets, since this value isn't sensitive), the same way
# TURNSTILE_SECRET_KEY below is supplied from a repository secret. Rotating
# the Turnstile site is then a GitHub Actions variable edit plus a workflow
# re-run, never a commit. Create the Turnstile widget itself
# (managed/non-interactive/invisible mode) in the Cloudflare dashboard, and
# add *.is-pinoy.dev as an allowed hostname.
TURNSTILE_SITE_KEY = ""

# TURNSTILE_SECRET_KEY is a secret, not a var — set with:
#   wrangler secret put TURNSTILE_SECRET_KEY -c worker/wrangler.toml
# Provisioned in CI by .github/workflows/deploy-contact-form.yml from the
# repository secret of the same name; rotating it is a GitHub secret edit
# plus a re-run of that workflow.

# Cloudflare Email Routing's send binding. Deliberately left unrestricted —
# no `destination_address` / `allowed_destination_addresses` — because owners
# are added as verified destinations dynamically (via the dashboard, see
# apps/dashboard/lib/cloudflare-email.ts) and this binding cannot be
# redeployed per owner. Left unrestricted, it can send to any address that is
# already a *verified* destination on this Cloudflare account — Cloudflare
# itself still refuses to deliver to anything unverified, so this is not an
# open relay. See the plan's "How Cloudflare Email Routing send actually
# works" section.
#
# One-time manual prerequisite, not automatable via API: Email Routing must
# be enabled on the is-pinoy.dev zone in the Cloudflare dashboard before this
# binding can send anything.
[[send_email]]
name = "EMAIL"

# Read-only access to the dashboard's registry database, for the
# `featuresOverride` a dashboard save writes directly (see
# apps/dashboard/lib/db/settings.ts and apps/dashboard/lib/db/schema.ts).
# `database_id` must be filled in with the same D1 database the dashboard
# points at via its CLOUDFLARE_D1_DATABASE_ID env var before this deploys —
# left as a placeholder here since that ID is environment-specific and not
# committed to the repo. `wrangler deploy` fails closed on a bad ID, which is
# the point: better a failed deploy than a binding to the wrong database.
[[d1_databases]]
binding = "SUBDOMAINS_DB"
database_name = "REPLACE_WITH_DASHBOARD_D1_DATABASE_NAME"
database_id = "REPLACE_WITH_DASHBOARD_D1_DATABASE_ID"

[[routes]]
pattern = "*.is-pinoy.dev/_tools/contact-form*"
zone_name = "is-pinoy.dev"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true
